# MongoDB + API + SPA. Gốc repo: docker compose --env-file .env.docker up --build

services:
  mongo:
    image: mongo:7
    container_name: workshift-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: workshift

  backend:
    build:
      context: ./workshift-backend
    container_name: workshift-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      MONGODB_URI: mongodb://mongo:27017/workshift
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      - mongo

  frontend:
    build:
      context: ./workshift-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: workshift-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-80}:8080"
    depends_on:
      - backend

volumes:
  mongo_data:
    name: workshift_mongo_data
